<!--
  Zeotein Cacao Starter Kit A/B ($89.99 renewal) - single-item CTA
  Funnel Umt82HHbzC9sF2J4yufE (NOT the original 3ViNcgRN6V1IrN4QwAUv, NOT Purple ECf5BDptvwguPNefZikN).
  Paste into each variant page: Settings > Tracking Code > Footer. Set ZK_VARIANT to 'a' (Control) or 'b' (Variation).

  On click of any CTA linking to /a/subscriptions/checkout/ or /cart/ (or class "zk-cta"):
    - fires Meta AddToCart + InitiateCheckout (and GA4 add_to_cart / begin_checkout if gtag exists)
    - POSTs to zeotein.com/cart/add: ONE item = try variant on Seal plan (no gifts; scoop/shaker are added by Flows after the order)
    - saves UTMs as cart attributes (they land on the Shopify order), then goes to /checkout
  utm_content is always starter_kit_<variant>; an ad's own utm_content is kept as utm_ad_content.
  One-field swaps: ZK_VARIANT_ID / ZK_PLAN.
-->
<script>
(function(){
  var ZK_VARIANT    = 'a';               // 'a' = Control, 'b' = Variation
  var ZK_VARIANT_ID = '67710100308181';  // Cacao Starter Kit — 30-Day Bulk Bag (try)
  var ZK_PLAN       = '4659019989';      // Seal: $76.99 first order, then $89.99/month
  var DEFAULT_UTM   = {utm_source:'purple-operator', utm_medium:'landing_page', utm_campaign:'cacao_starter_kit_8999_ab'};

  function utms(){
    var q=new URLSearchParams(location.search), o={};
    Object.keys(DEFAULT_UTM).forEach(function(k){ o[k]=q.get(k)||DEFAULT_UTM[k]; });
    if(q.get('utm_term')) o.utm_term=q.get('utm_term');
    if(q.get('utm_content')) o.utm_ad_content=q.get('utm_content');
    if(q.get('fbclid')) o.fbclid=q.get('fbclid');
    o.utm_content='starter_kit_'+ZK_VARIANT;
    o.landing_variant=ZK_VARIANT;
    return o;
  }
  function add(f,n,v){ var i=document.createElement('input'); i.type='hidden'; i.name=n; i.value=v; f.appendChild(i); }
  function go(){
    var u=utms();
    try{ fbq('track','AddToCart',{value:76.99,currency:'USD',content_ids:[ZK_VARIANT_ID],content_type:'product'}); fbq('track','InitiateCheckout',{value:76.99,currency:'USD',num_items:1}); }catch(e){}
    try{ gtag('event','add_to_cart',{currency:'USD',value:76.99,items:[{item_id:ZK_VARIANT_ID}]}); gtag('event','begin_checkout',{currency:'USD',value:76.99}); }catch(e){}
    var f=document.createElement('form'); f.method='POST'; f.action='https://zeotein.com/cart/add';
    add(f,'id',ZK_VARIANT_ID); add(f,'quantity','1'); add(f,'selling_plan',ZK_PLAN);
    Object.keys(u).forEach(function(k){ add(f,'attributes['+k+']',u[k]); });
    add(f,'return_to','/checkout?'+new URLSearchParams(u).toString());
    document.body.appendChild(f);
    setTimeout(function(){ f.submit(); },150);
  }
  document.addEventListener('click',function(e){
    var a=e.target&&e.target.closest&&e.target.closest('a.zk-cta, a[href*="/a/subscriptions/checkout/"], a[href*="zeotein.com/cart/"]');
    if(!a) return; e.preventDefault(); e.stopImmediatePropagation(); go();
  },true);
})();
</script>
