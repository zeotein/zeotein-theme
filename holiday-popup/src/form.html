<form class="zt-hg-form" data-source="__SOURCE__" novalidate>
  <input class="zt-hg-in" type="text" name="firstName" placeholder="First name" autocomplete="given-name" required maxlength="60">
  <input class="zt-hg-in" type="email" name="email" placeholder="Email address" autocomplete="email" required maxlength="120">
  <label class="zt-hg-in zt-hg-phone"><span class="zt-hg-cc">🇺🇸 +1</span><input type="tel" name="phone" placeholder="Mobile number (optional)" autocomplete="tel-national" inputmode="tel" maxlength="16"></label>
  <label class="zt-hg-tcpa"><input type="checkbox" name="smsConsent" value="yes"><span data-zt-consent>Yes, text me recipes and holiday offers. By checking this box, you agree to receive recurring automated marketing texts from Zeotein at the number provided. Consent is not a condition of purchase. Msg &amp; data rates may apply. Msg frequency varies. Reply STOP to opt out, HELP for help. <a href="https://zeotein.com/policies/terms-of-service" target="_blank" rel="noopener">Terms</a> &amp; <a href="https://zeotein.com/policies/privacy-policy" target="_blank" rel="noopener">Privacy</a>.</span></label>
  <input class="zt-hg-hp" type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">
  <div class="zt-hg-err" role="alert"></div>
  <button class="zt-hg-btn" type="submit">__CTA__</button>
</form>
