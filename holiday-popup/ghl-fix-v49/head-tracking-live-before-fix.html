function structureOk(p){
  if(!p||p.getAttribute('data-zt-holiday')!=='1')return false;

  var copy=p.querySelector(':scope > .zt-copy');
  var col=p.querySelector(':scope > .drop-zone-draggable');
  if(!art||!copy||!col)return false;
  if(!art.querySelector('img'))return false;
  if(art.querySelector('input, form, button, .c-form, .hl-app, .drop-zone-draggable'))return false;
  if(col.contains(copy)||art.contains(col)||art.contains(copy))return false;
  return true;
}
function repair(p){
  var art=p.querySelector('.zt-art');
  var copy=p.querySelector('.zt-copy');
  var col=p.querySelector('.drop-zone-draggable');
  if(art&&col&&art.contains(col)){
    p.insertBefore(col, art.nextSibling);
  }
  if(art){
    [].slice.call(art.children).forEach(function(k){
      if(k.classList&&k.classList.contains('zt-handle'))return;
      if(k.tagName==='IMG')return;
      if(col)col.appendChild(k);
    });
    if(!art.querySelector('img')){
      var img=document.createElement('img');
      img.alt='Zeotein Holiday Recipe Guide';
      img.src=COVER;
      art.appendChild(img);
    }
  }
  if(copy&&copy.parentNode!==p){
    if(col)p.insertBefore(copy,col);
    else p.appendChild(copy);
  }
}

window.__ztHolidaySkinV44=1;
window.__ztHolidaySkinV45=1;
window.__ztHolidaySkinV46=1;
var PID='hl_main_popup-k47rXJwWBv';
function goodPopup(){
  var ps=document.querySelectorAll('[id="'+PID+'"]');
  for(var i=0;i<ps.length;i++){
    var p=ps[i];
    if(p.getAttribute('data-zeotein-hidden')==='old-survey')continue;
    if(p.getAttribute('data-zt-holiday')==='1')return p;
  }
  return document.getElementById(PID);
}
function isShown(el){
  if(!el)return false;
  var s=window.getComputedStyle(el);
  if(s.display==='none'||s.visibility==='hidden'||Number(s.opacity)===0)return false;
  var r=el.getBoundingClientRect();
  return r.width>2&&r.height>2;
}
function setImp(el,prop,val){
  if(!el||!el.style)return;
  if(el.style.getPropertyValue(prop)===val&&el.style.getPropertyPriority(prop)==='important')return;
  el.style.setProperty(prop,val,'important');

function textX(el){
  if(!el)return 0;
  var pad=parseFloat(window.getComputedStyle(el).paddingLeft)||0;
  return el.getBoundingClientRect().left+pad;
}
function needsAlign(p){
  if(!p)return false;
  var email=p.querySelector('input[name="email"],input[type="email"]');
  if(!email)return false;
  var first=p.querySelector('input[name="first_name"]');
  if(!first){
    var pl=email.style.getPropertyValue('padding-left');
    return !(pl==='16px'&&email.style.getPropertyPriority('padding-left')==='important');
  }
  return Math.abs(Math.round(textX(email)-textX(first)))>1;

function applyPadding(p){
  var wraps=p.querySelectorAll('.email-input-wrapper,.email-input,.email-input-wrapper > div');
  for(var j=0;j<wraps.length;j++){
    setImp(wraps[j],'padding-left','0px');

  }
  var emails=p.querySelectorAll('input[name="email"],input[type="email"]');
  var first=p.querySelector('input[name="first_name"]');
  var i,el;
  if(!first){
    for(i=0;i<emails.length;i++){
      setImp(emails[i],'padding-left','16px');
      setImp(emails[i],'text-indent','0');
      setImp(emails[i],'background-image','none');
    }
    return;
  }
  var firstPad=parseFloat(window.getComputedStyle(first).paddingLeft)||16;
  for(i=0;i<emails.length;i++){

function resetWrapMargin(p){
  var wraps=p.querySelectorAll('.email-input-wrapper,.email-input,.email-input-wrapper > div');

function nudgeMargin(p){
