<!-- Zeotein holiday guide one-step opt-in form (landing page). Built by holiday-popup/build.py. -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<script>window.ZT_HG=Object.assign(window.ZT_HG||{},{"endpoint": ""});</script>
<style>.zt-hg{--pine:#0f3b2e;--pine2:#0a2a20;--red:#b5232f;--red2:#8f1622;--cream:#fbf5ea;--gold:#e0b65a;font-family:Poppins,system-ui,sans-serif;letter-spacing:0;line-height:1.4;color:#1d1d1f}
.zt-hg *,.zt-hg *::before,.zt-hg *::after{box-sizing:border-box;margin:0;padding:0}
.zt-hg-in{width:100%;height:50px;border:1.5px solid #d8cfc0;border-radius:10px;padding:0 16px;font:400 16px Poppins,system-ui,sans-serif;color:#1d1d1f;background:#fff;display:flex;align-items:center;margin-bottom:10px;outline:none}
.zt-hg-in:focus,.zt-hg-phone:focus-within{border-color:var(--pine)}
.zt-hg-phone{gap:10px;cursor:text}
.zt-hg-phone input{flex:1;min-width:0;border:0;outline:none;font:inherit;color:inherit;background:none;height:100%}
.zt-hg-cc{font-weight:600;color:#333;border-right:1.5px solid #d8cfc0;padding-right:10px;white-space:nowrap}
.zt-hg-tcpa{display:flex;gap:9px;align-items:flex-start;font-size:10.5px;line-height:1.45;color:#6f675b;margin:2px 0 10px;text-align:left;cursor:pointer}
.zt-hg-tcpa input{flex:0 0 auto;width:17px;height:17px;margin-top:1px;accent-color:var(--pine);cursor:pointer}
.zt-hg-tcpa a{color:inherit;text-decoration:underline}
.zt-hg-tcpa span{flex:1 1 auto;min-width:0}
.zt-hg-form{width:100%;min-width:0}
.zt-hg-hp{position:absolute!important;left:-9999px;width:1px;height:1px;opacity:0}
.zt-hg-err{color:var(--red);font-size:13px;margin:-4px 0 6px;text-align:left}
.zt-hg-err:empty{display:none}
.zt-hg-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border:0;border-radius:12px;cursor:pointer;background:linear-gradient(180deg,#c92a37,var(--red2));color:#fff;font:700 18px Poppins,system-ui,sans-serif;letter-spacing:.3px;box-shadow:0 6px 0 #6d0f18,0 10px 24px rgba(0,0,0,.25);text-transform:uppercase;margin-top:4px}
.zt-hg-btn[disabled]{opacity:.7;cursor:wait}
.zt-hg-done{display:inline-flex;align-items:center;gap:8px;font:600 13.5px Poppins,system-ui,sans-serif;color:#1f7a55;background:#e6f4ec;border-radius:999px;padding:7px 14px;margin-bottom:10px}
/* Host-page hardening: GHL/Shopify form CSS must not restyle these fields. */
.zt-hg:is(#zt-hg-lp,#zt-hp) .zt-hg-form input.zt-hg-in[type],.zt-hg:is(#zt-hg-lp,#zt-hp) .zt-hg-form label.zt-hg-in{background:#fff!important;border:1.5px solid #d8cfc0!important;border-radius:10px!important;box-shadow:none!important;height:50px!important;padding:0 16px!important;font:400 16px/1.2 Poppins,system-ui,sans-serif!important;color:#1d1d1f!important;margin:0 0 10px!important;width:100%!important;max-width:none!important}
.zt-hg:is(#zt-hg-lp,#zt-hp) .zt-hg-form input.zt-hg-in:focus,.zt-hg:is(#zt-hg-lp,#zt-hp) .zt-hg-form label.zt-hg-phone:focus-within{border-color:#0f3b2e!important}
.zt-hg:is(#zt-hg-lp,#zt-hp) .zt-hg-form .zt-hg-phone input[type=tel]{all:unset;flex:1;min-width:0;height:100%;font:400 16px/1.2 Poppins,system-ui,sans-serif!important;color:#1d1d1f!important;background:none!important;border:0!important;box-shadow:none!important;padding:0!important;margin:0!important}
.zt-hg:is(#zt-hg-lp,#zt-hp) .zt-hg-form .zt-hg-tcpa,.zt-hg:is(#zt-hg-lp,#zt-hp) .zt-hg-form .zt-hg-tcpa span{font:400 10.5px/1.45 Poppins,system-ui,sans-serif!important;hyphens:manual!important;-webkit-hyphens:manual!important;word-break:normal!important;letter-spacing:0!important;color:#6f675b!important;text-transform:none!important}
.zt-hg:is(#zt-hg-lp,#zt-hp) .zt-hg-form .zt-hg-tcpa input{all:revert;width:17px!important;height:17px!important;margin:1px 0 0!important;flex:0 0 auto;accent-color:#0f3b2e}
.zt-hg:is(#zt-hg-lp,#zt-hp) .zt-hg-form input::placeholder{color:#8a8273!important;opacity:1}
@media (max-width:700px){.zt-hg:is(#zt-hg-lp,#zt-hp) .zt-hg-form input.zt-hg-in[type],.zt-hg:is(#zt-hg-lp,#zt-hp) .zt-hg-form label.zt-hg-in{height:46px!important;margin-bottom:8px!important}.zt-hg:is(#zt-hg-lp,#zt-hp) .zt-hg-form .zt-hg-tcpa,.zt-hg:is(#zt-hg-lp,#zt-hp) .zt-hg-form .zt-hg-tcpa span{font-size:10px!important}}
</style><script>/* Shared one-step signup logic for the pop-up and the landing page form.
   window.ZT_HG = { endpoint, source } must be set before this runs.
   onSuccess(form, info) is called after the relay confirms; Meta Lead fires exactly once per success. */
window.ztHgBind = function (form, onSuccess) {
  var cfg = window.ZT_HG || {};
  function err(msg) { form.querySelector('.zt-hg-err').textContent = msg || ''; }
  function post(payload) {
    if (!cfg.endpoint) return Promise.reject(new Error('not_configured'));
    return fetch(cfg.endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok || !j.ok) throw new Error(j.error || 'failed'); return j; }); });
  }
  form.addEventListener('submit', function (e) {
    e.preventDefault(); err();
    var fn = form.firstName.value.trim(), em = form.email.value.trim();
    var raw = form.phone.value.trim(), consent = form.smsConsent.checked;
    var digits = raw.replace(/\D/g, '').replace(/^1(?=\d{10}$)/, '');
    if (!fn) return err('Please add your first name.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)) return err('Please enter a valid email.');
    if (raw && digits.length !== 10) return err('Please enter a 10-digit US mobile number, or leave it blank.');
    if (consent && !raw) return err('Add your mobile number to get texts, or uncheck the box.');
    var source = form.getAttribute('data-source') || cfg.source;
    var payload = { firstName: fn, email: em, company: form.company.value, source: source, pageUrl: location.href };
    // Phone is only sent with explicit consent (box is unchecked by default).
    if (raw && consent) { payload.phone = '+1' + digits; payload.smsConsent = true; payload.consentText = form.querySelector('[data-zt-consent]').innerText.trim(); }
    var btn = form.querySelector('.zt-hg-btn'); btn.disabled = true;
    post(payload).then(function () {
      try { if (typeof window.fbq === 'function') fbq('track', 'Lead', { content_name: 'Holiday Recipe Guide', content_category: source }); } catch (x) {}
      try { (window.dataLayer = window.dataLayer || []).push({ event: 'zt_holiday_guide_lead', source: source, sms: !!payload.smsConsent }); } catch (x) {}
      onSuccess && onSuccess(form, { email: em, sms: !!payload.smsConsent });
    }).catch(function () { err('Something went wrong. Please try again.'); })
      .then(function () { btn.disabled = false; });
  });
};
</script>
<div id="zt-hg-lp" class="zt-hg zt-hg-lp">
  <div class="zt-hg-lp__head"><div class="zt-hg-lp__t">Get your free guide</div><div class="zt-hg-lp__s">Enter your details and we'll send the Holiday Recipe Guide straight to your inbox.</div></div>
  <form class="zt-hg-form" data-source="holiday-guide-lp" novalidate>
  <input class="zt-hg-in" type="text" name="firstName" placeholder="First name" autocomplete="given-name" required maxlength="60">
  <input class="zt-hg-in" type="email" name="email" placeholder="Email address" autocomplete="email" required maxlength="120">
  <label class="zt-hg-in zt-hg-phone"><span class="zt-hg-cc">🇺🇸 +1</span><input type="tel" name="phone" placeholder="Mobile number (optional)" autocomplete="tel-national" inputmode="tel" maxlength="16"></label>
  <label class="zt-hg-tcpa"><input type="checkbox" name="smsConsent" value="yes"><span data-zt-consent>Yes, text me recipes and holiday offers. By checking this box, you agree to receive recurring automated marketing texts from Zeotein at the number provided. Consent is not a condition of purchase. Msg &amp; data rates may apply. Msg frequency varies. Reply STOP to opt out, HELP for help. <a href="https://zeotein.com/policies/terms-of-service" target="_blank" rel="noopener">Terms</a> &amp; <a href="https://zeotein.com/policies/privacy-policy" target="_blank" rel="noopener">Privacy</a>.</span></label>
  <input class="zt-hg-hp" type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">
  <div class="zt-hg-err" role="alert"></div>
  <button class="zt-hg-btn" type="submit">Get My Free Guide 🎄</button>
</form>

  <div class="zt-hg-lp__done" hidden><div class="zt-hg-done">✓ You're in! Your guide is on its way.</div></div>
</div>
<style>
.zt-hg-lp{flex:1 1 100%;width:100%;min-width:0;max-width:460px;margin:0 auto;text-align:left}
.zt-hg-lp .zt-hg-tcpa{color:inherit;opacity:.8}
.zt-hg-lp__done{text-align:center}
.zt-hg-lp__head{text-align:center;margin-bottom:16px}
.zt-hg-lp__t{font:600 22px/1.2 Poppins,system-ui,sans-serif;text-transform:uppercase;color:#1d1d1f}
.zt-hg-lp__s{font:400 14px/1.45 Poppins,system-ui,sans-serif;color:#333;margin-top:4px}
</style>
<script>
(function(){
  var box = document.getElementById('zt-hg-lp'); if(!box) return;
  window.ztHgBind(box.querySelector('.zt-hg-form'), function(form){
    try{ localStorage.setItem('zt_hp_v1', JSON.stringify({submitted: Date.now()})); }catch(e){}
    document.dispatchEvent(new Event('zt:hg-submitted'));
    form.hidden = true; box.querySelector('.zt-hg-lp__head').hidden = true; box.querySelector('.zt-hg-lp__done').hidden = false;
    var next = (window.ZT_HG||{}).nextUrl;
    if(next) setTimeout(function(){ location.href = next; }, 900);
  });
})();
</script>
