<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zeotein · Simple on Purpose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Inter:wght@400;500&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Homepage scroll animation, "Simple on purpose". One pinned stage drawn at a fixed design size
   (1600x900 desktop, 420x746 phone) and scaled to fit; render(p) places everything for scroll progress p.
   window.__zmSetProgress(p, t) renders any frame exactly (used for the screen recordings). */
:root{--bg:#0A0312;--cream:#F4EEE4;--lilac:#C9B6E8;--teal:#32BAC0;--mute:rgba(244,238,228,.64);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;--head:"Poppins",system-ui,sans-serif;--sans:"Inter",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--cream);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.scroller{position:relative;height:1100vh}
.pin{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:radial-gradient(70% 60% at 50% 40%,#22103A 0%,#130720 50%,var(--bg) 100%)}
.stage{position:absolute;left:50%;top:50%;transform-origin:0 0}
.abs{position:absolute;left:0;top:0;will-change:transform,opacity}

.beam{position:absolute;left:50%;top:-10%;width:62vmin;height:120%;transform:translateX(-50%);pointer-events:none;
  background:linear-gradient(180deg,rgba(214,196,255,.30),rgba(214,196,255,.08) 45%,rgba(214,196,255,0) 80%);
  clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);filter:blur(28px);mix-blend-mode:screen}
canvas.dust{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen;pointer-events:none}
.grain{position:absolute;inset:-50%;opacity:.05;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(90% 80% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.5) 100%)}

.nav{position:fixed;inset:0 0 auto 0;z-index:30;display:flex;align-items:center;gap:36px;padding:20px 40px}
.nav .logo{display:flex;background:var(--cream);border-radius:999px;padding:7px 16px}.nav .logo img{height:24px;width:auto;display:block}
.nav .links{display:flex;gap:30px;margin-left:auto;font-family:var(--head);font-weight:500;font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.nav .cta{font-family:var(--head);font-weight:600;font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;border:1px solid rgba(244,238,228,.5);padding:11px 20px}
@media (max-width:760px){.nav{padding:14px 16px}.nav .links{display:none}.nav .cta{margin-left:auto;padding:9px 14px;font-size:.62rem}.nav .logo img{height:20px}}

/* giant numerals */
.mega{font-family:var(--serif);font-weight:300;line-height:.8;letter-spacing:-.05em;white-space:nowrap;color:transparent;-webkit-text-stroke:1.4px rgba(201,182,232,.22)}
/* products */
.prod img{display:block;width:100%;height:auto;filter:drop-shadow(0 30px 40px rgba(0,0,0,.55)) drop-shadow(0 0 50px rgba(122,71,174,.35))}
.card{border-radius:22px;overflow:hidden;box-shadow:0 0 0 1px rgba(244,238,228,.16),0 30px 50px rgba(0,0,0,.5)}
.card img{display:block;width:100%;height:100%;object-fit:cover}
.glow{border-radius:50%;background:radial-gradient(closest-side,rgba(95,45,144,.55),rgba(50,186,192,.08) 60%,rgba(0,0,0,0))}
/* ingredient discs */
.disc .ph{position:absolute;inset:0;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px rgba(244,238,228,.22),0 18px 34px rgba(0,0,0,.55)}
.disc .ph img{width:150%;height:150%;margin:-25%;object-fit:cover;display:block}
.disc .lb{position:absolute;left:50%;top:calc(100% + 12px);transform:translateX(-50%);white-space:nowrap;text-align:center;font-family:var(--head);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--cream)}
.disc .lb small{display:block;margin-top:3px;font-family:var(--sans);font-weight:400;font-size:11px;letter-spacing:.04em;text-transform:none;color:var(--mute)}
/* copy */
.kick{font-family:var(--head);font-weight:600;font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--teal)}
.h{font-family:var(--serif);font-weight:300;letter-spacing:-.035em;line-height:.95}
.h i{font-style:italic;color:var(--lilac)}
.line{display:block;overflow:hidden;padding-bottom:.08em}.line>span{display:block}
.sub{font-size:18px;line-height:1.6;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{font-family:var(--head);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;border:1px solid rgba(244,238,228,.3)}
.chips span.on{background:var(--cream);color:var(--bg);border-color:var(--cream)}
.scroll{font-family:var(--head);font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:12px}
.scroll i{display:block;width:1px;height:40px;background:linear-gradient(var(--cream),transparent)}
/* choice cards */
.pick{border-radius:24px;background:rgba(244,238,228,.06);box-shadow:0 0 0 1px rgba(244,238,228,.16);backdrop-filter:blur(8px);padding:22px;display:flex;flex-direction:column}
.pick .im{height:150px;display:flex;align-items:flex-end;justify-content:center}
.pick .im img{max-height:100%;max-width:100%;object-fit:contain;filter:drop-shadow(0 16px 20px rgba(0,0,0,.5))}
.pick .im.ph img{width:100%;height:100%;object-fit:cover;border-radius:14px}
.pick .n{margin-top:16px;font-family:var(--serif);font-weight:300;font-size:46px;line-height:.9}
.pick .n small{font-family:var(--head);font-weight:600;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-left:8px}
.pick b{display:block;margin-top:10px;font-family:var(--head);font-weight:600;font-size:19px}
.pick p{font-size:14px;color:var(--mute);margin-top:4px}
.pick .go{margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.pick .go span{font-family:var(--head);font-weight:600;font-size:15px}
.pick .go span small{display:block;font-family:var(--sans);font-weight:400;font-size:11px;color:var(--mute)}
.pick .go a{font-family:var(--head);font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;background:var(--cream);color:var(--bg);padding:13px 16px;white-space:nowrap}
.pick.t .go a{background:var(--teal);color:#08292B}
.pick.g .go a{background:transparent;color:var(--cream);box-shadow:inset 0 0 0 1px rgba(244,238,228,.6)}
.m .pick{padding:12px 14px;flex-direction:row;align-items:center;gap:12px;border-radius:18px}
.m .pick .im{height:74px;width:74px;flex:none}.m .pick .im.ph img{border-radius:10px}
.m .pick .n{margin:0;font-size:34px}.m .pick b{margin-top:2px;font-size:15px}.m .pick p{display:none}
.m .pick .go{margin:6px 0 0}.m .pick .go a{padding:9px 10px;font-size:10px}.m .pick .go span{font-size:13px}
.m .disc .lb{font-size:9px;letter-spacing:.1em;top:calc(100% + 6px)}.m .disc .lb small{display:none}
.m .sub{font-size:14px}.m .kick{font-size:10px}.m .chips span{font-size:9px;padding:6px 9px}
.after{position:relative;background:var(--bg);padding:80px 20px;text-align:center;font-family:var(--serif);font-style:italic;font-size:1.5rem;color:var(--mute)}
@media (prefers-reduced-motion:reduce){.scroller{height:auto}.pin{position:relative}}
</style>
</head>

<script>

  // ---------- helpers ----------

  }

  }
  function place(e, x, y, w, h, o, r, extra){

    e.style.transform = 'translate(' + (x - w / 2).toFixed(1) + 'px,' + (y - (h == null ? w : h) / 2).toFixed(1) + 'px) rotate(' + (r || 0).toFixed(2) + 'deg)' + (extra || '');

  }

  var cv = $('dust'), ctx = cv.getContext('2d'), motes = [], seed = 9, W = 0, H = 0;
  function rnd(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  for (var i = 0; i < 90; i++) motes.push({x: rnd(), y: rnd(), r: .5 + rnd() * 1.8, s: .2 + rnd() * .8, a: .15 + rnd() * .5, w: rnd() * 6.28});
  function size(){ W = pin.clientWidth; H = pin.clientHeight; var d = Math.min(2, devicePixelRatio || 1); cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); }

  function render(p, time){
    time = time || 0;
    var w = where(p), bob = Math.sin(time * 1.2);

      if (key !== 'glow') e.style.filter = 'blur(' + ((1 - s[3]) * 10).toFixed(1) + 'px)';
    });
    // ingredient discs

      var key = 'd' + i, s = state(key, w, i % 6, 5), e = els[key];
      var fl = Math.sin(time * 1.4 + i * 1.7) * (mobile ? 2 : 5);

    });
    // giant numerals behind

      var e = els.megas[k], i = STOPS.findIndex(function(x){ return x[0] === k; }), st = STOPS[i];
      var a = st[1] - .05, b = st[2] + .05, o = seg(p, a, a + .05) * (1 - seg(p, b - .04, b));

    });
    // copy

      var e = els.copy[k], c = COPY[k], i = STOPS.findIndex(function(x){ return x[0] === k; }), st = STOPS[i];
      var end = k === 'P' ? STOPS[i + 1][2] : st[2];

      var o = (k === 'H' ? 1 - seg(p, .03, .09) : out(tin) * (1 - tout));

      else { x = 110; y = k === 'S' ? 340 : 290; }

      e.style.opacity = o.toFixed(3); e.style.visibility = o < .005 ? 'hidden' : 'visible';
      e.style.transform = 'translate(' + x + 'px,' + (y - tout * 30).toFixed(1) + 'px)';
      e.lines.forEach(function(s, j){ var kk = k === 'H' ? 1 : out(seg(p, st[1] - .045 + j * .012, st[1] + .005 + j * .012)); s.style.transform = 'translateY(' + ((1 - kk) * 110).toFixed(1) + '%)'; });
      e.rest.forEach(function(s, j){ var kk = k === 'H' ? 1 : out(seg(p, st[1] - .03 + j * .008, st[1] + .015 + j * .008)); s.style.opacity = kk.toFixed(3); s.style.transform = 'translateY(' + ((1 - kk) * 12).toFixed(1) + 'px)'; });
      if (k === 'P') { var chips = e.querySelectorAll('.chips span'); var two = seg(p, .6, .63); chips[0].className = ''; chips[1].className = ''; if (chips.length) { e.querySelector('.sub').innerHTML = two > .5 ? 'Eight of the nine are also sold on their own. The mineral stays in the blends.' : 'Every Zeotein product is made from this one short list.'; } }
    });
    // pick cards
    els.picks.forEach(function(e, i){
      var k = out(seg(p, .82 + i * .02, .9 + i * .02));
      if (mobile) place(e, 210, 300 + i * 132 + (1 - k) * 60, 388, 118, k, 0);
      else { var x = 800 + (i - 1) * 390; e.style.width = '360px'; e.style.transform = 'translate(' + (x - 180) + 'px,' + (330 + (1 - k) * 90).toFixed(1) + 'px)'; e.style.opacity = k.toFixed(3); e.style.visibility = k < .005 ? 'hidden' : 'visible'; }
    });
    beam.style.opacity = (.7 + .3 * Math.sin(time * .6)).toFixed(3);
    beam.style.transform = 'translateX(-50%) rotate(' + (Math.sin(time * .35) * 2.5).toFixed(2) + 'deg)';
    ctx.clearRect(0, 0, W, H);
    motes.forEach(function(m){
      var y = ((m.y - p * m.s * 1.4 - time * .012 * m.s) % 1 + 1) % 1, x = m.x + Math.sin(time * .3 + m.w) * .01;
      var inBeam = 1 - Math.min(1, Math.abs(x - .5) / (.18 + y * .25));
      ctx.globalAlpha = m.a * (.25 + .75 * inBeam); ctx.fillStyle = '#E9DDFF'; ctx.beginPath(); ctx.arc(x * W, y * H, m.r, 0, 6.283); ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  build();
  addEventListener('resize', function(){ var was = mobile; if ((pin.clientWidth <= 760) !== was) build(); else fit(); render(cur, clock); });
  var cur = 0, target = 0, clock = 0, last = performance.now(), sc = $('scroller');
  window.__zmSetProgress = function(p, t){ cur = p; render(p, t == null ? clock : t); };
  var q = new URLSearchParams(location.search);
  if (q.has('p')) { render(parseFloat(q.get('p')), 0); return; }
  if (q.has('manual')) { render(0, 0); return; }
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { render(.95, 0); return; }
  function read(){ var r = sc.getBoundingClientRect(), span = sc.offsetHeight - innerHeight; target = clamp(-r.top / span); }
  addEventListener('scroll', read, {passive: true}); read(); cur = target;

    cur += (target - cur) * (1 - Math.pow(.0012, dt)); render(cur, clock); requestAnimationFrame(frame); })(last);
